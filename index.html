<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Harsh Jadon — Computer Science undergraduate specializing in full-stack web development and computer vision.">
    <title>Harsh Jadon | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>

    <main class="terminal-shell" aria-label="Harsh Jadon Interactive Terminal Portfolio">
        <header class="terminal-header">
            <div class="window-controls" aria-hidden="true">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="terminal-title">harsh@portfolio: ~/resume</div>
            <div class="header-actions">
                <button type="button" id="skip-btn" class="header-btn" title="Show full portfolio immediately (Esc)">Skip</button>
                <button type="button" id="replay-btn" class="header-btn" title="Replay terminal boot animation">Replay</button>
                <button type="button" id="matrix-btn" class="header-btn" aria-pressed="true" title="Toggle Matrix rain background">Matrix: ON</button>
            </div>
        </header>

        <div id="terminal" role="log" aria-live="polite"></div>

        <footer class="terminal-footer">
            <div class="quick-commands" aria-label="Quick section commands">
                <button type="button" class="cmd-chip" data-cmd="help">help</button>
                <button type="button" class="cmd-chip" data-cmd="whoami">whoami</button>
                <button type="button" class="cmd-chip" data-cmd="experience">experience</button>
                <button type="button" class="cmd-chip" data-cmd="projects">projects</button>
                <button type="button" class="cmd-chip" data-cmd="skills">skills</button>
                <button type="button" class="cmd-chip" data-cmd="education">education</button>
                <button type="button" class="cmd-chip" data-cmd="achievements">achievements</button>
                <button type="button" class="cmd-chip" data-cmd="contact">contact</button>
                <button type="button" class="cmd-chip" data-cmd="all">all</button>
                <button type="button" class="cmd-chip" data-cmd="clear">clear</button>
            </div>

            <form id="prompt-form" class="prompt-bar" autocomplete="off">
                <label for="cmd-input" class="prompt-label">harsh@jadon:~$</label>
                <input
                    id="cmd-input"
                    type="text"
                    spellcheck="false"
                    autocapitalize="off"
                    autocomplete="off"
                    placeholder="Type 'help', 'projects', 'experience', or 'sudo hire harsh'..."
                    aria-label="Terminal command input"
                >
            </form>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
